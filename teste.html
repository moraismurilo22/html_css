<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Matrícula - Escola Online</title>
</head>

<body>

    <h1>Matrícula - Escola Online</h1>

    <form>

        <fieldset>

            <legend>Dados Pessoais</legend>

            <label>Nome Completo:</label>
            <input type="text">
            <br><br>

            <label>Data de Nascimento:</label>
            <input type="date">
            <br><br>

            <label>E-mail do Aluno:</label>
            <input type="email" placeholder="aluno@exemplo.com">
            <br><br>

            <label>Senha de Acesso:</label>
            <input type="password" placeholder="*********">
            <br><br>

            <label>Telefone de Emergência:</label>
            <input type="tel" placeholder="(00) 00000-0000">

        </fieldset>

        <br>

        <fieldset>

            <legend>Preferências de Estudo</legend>

            <label>Áreas de Interesse:</label>
            <br><br>

            <input type="checkbox">
            <label>Front-end</label>
            <br>

            <input type="checkbox">
            <label>Back-end</label>
            <br>

            <input type="checkbox">
            <label>Design</label>
            <br>

            <input type="checkbox">
            <label>Dados</label>
            <br><br>

            <label>Como conheceu a escola?</label>

            <select>
                <option>Selecione...</option>
                <option>Indicação</option>
                <option>Google</option>
                <option>Redes sociais</option>
            </select>

        </fieldset>

        <br>

        <button type="submit">Matricular</button>
        <button type="reset">Limpar</button>

    </form>

</body>

</html>
